map $host $wikimedia_backend {
    upload.wikimedia.org wikimedia.upload-lb;
    default wikimedia.text_gerrit-lb;
}

upstream wikimedia.text_gerrit-lb {
    least_time header;
    # server 103.102.166.224:443 max_fails=2 fail_timeout=15s;
    server 103.102.166.225:443 max_fails=2 fail_timeout=15s;
    server 185.15.58.224:443 max_fails=2 fail_timeout=15s;
    server 185.15.58.225:443 max_fails=2 fail_timeout=15s;
    server 185.15.59.224:443 max_fails=2 fail_timeout=15s;
    server 185.15.59.225:443 max_fails=2 fail_timeout=15s;
    server 195.200.68.224:443 max_fails=2 fail_timeout=15s;
    server 195.200.68.225:443 max_fails=2 fail_timeout=15s;
    server 198.35.26.224:443 max_fails=2 fail_timeout=15s;
    server 198.35.26.225:443 max_fails=2 fail_timeout=15s;
    server 208.80.153.224:443 max_fails=2 fail_timeout=15s;
    server 208.80.153.225:443 max_fails=2 fail_timeout=15s;
    server 208.80.154.224:443 max_fails=2 fail_timeout=15s;
    server 208.80.154.225:443 max_fails=2 fail_timeout=15s;
    keepalive 64;
}

upstream wikimedia.upload-lb {
    least_time header;
    # server 103.102.166.240:443 max_fails=2 fail_timeout=15s;
    server 185.15.58.240:443 max_fails=2 fail_timeout=15s;
    server 185.15.59.240:443 max_fails=2 fail_timeout=15s;
    server 195.200.68.240:443 max_fails=2 fail_timeout=15s;
    server 198.35.26.240:443 max_fails=2 fail_timeout=15s;
    server 208.80.153.240:443 max_fails=2 fail_timeout=15s;
    server 208.80.154.240:443 max_fails=2 fail_timeout=15s;
    keepalive 64;
}

server {
    server_name .wikipedia.org .wiktionary.org .wikiquote.org .wikibooks.org .wikisource.org .wikinews.org .wikiversity.org .wikivoyage.org .wikidata.org .wikifunctions.org .mediawiki.org .wikimediafoundation.org .wikimedia.org;
    set $backend $wikimedia_backend;
    include shared/server/base.conf;
}
