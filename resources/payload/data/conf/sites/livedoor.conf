map $host $livedoor_backend {
    hostnames;
    .blogimg.jp livedoor.cloudfront;
    ~^(?:(?:blog|app\.blog|t\.blog|blog-01|stf|image\.profile)\.)?livedoor\.jp$ $host;
    ~^(?:resize|ipcheck)\.blogsys\.jp$ livedoor.cloudfront;
    ~^(?:richlink|ldapp|richlink-api|rssfetcher)\.blogsys\.jp$ $host;
    ~^(?:image\.blog|cdn|parts\.blog|blog\.m)\.livedoor\.jp$ livedoor.cloudfront;
    default blog.jp;
}

upstream blog.livedoor.jp {
    server 147.92.146.242:443;
    keepalive 64;
}

upstream livedoor.jp {
    server 147.92.240.79:443;
    keepalive 64;
}

upstream app.blog.livedoor.jp {
    server 147.92.242.97:443;
    keepalive 64;
}

upstream t.blog.livedoor.jp {
    server 147.92.240.57:443;
    keepalive 64;
}

upstream blog-01.livedoor.jp {
    server 147.92.146.242:443;
    keepalive 64;
}

upstream stf.livedoor.jp {
    server 147.92.184.137:443;
    keepalive 64;
}

upstream image.profile.livedoor.jp {
    server 147.92.184.44:443;
    keepalive 64;
}

upstream richlink.blogsys.jp {
    server 147.92.241.191:443;
    keepalive 64;
}

upstream richlink-api.blogsys.jp {
    server 147.92.241.191:443;
    keepalive 64;
}

upstream rssfetcher.blogsys.jp {
    server 147.92.241.65:443;
    keepalive 64;
}

upstream ldapp.blogsys.jp {
    server 147.92.241.138:443;
    keepalive 64;
}

upstream livedoor.cloudfront {
    least_time header;
    include shared/upstream/cloudfront.conf;
    keepalive 64;
}

server {
    server_name .blog.jp .doorblog.jp .ldblog.jp .dreamlog.jp .publog.jp .livedoor.biz .diary.to .weblog.to .bloggeek.jp .blogism.jp .blogo.jp .blogstation.jp .blogto.jp .gger.jp .golog.jp .liblo.jp .myjournal.jp .mynikki.jp .xxxblog.jp .youblog.jp .2chblog.jp .teamblog.jp .corpblog.jp .officeblog.jp .storeblog.jp .cafeblog.jp .officialblog.jp .techblog.jp .livedoor.blog .livedoor.jp .blogsys.jp .blogimg.jp;
    set $backend $livedoor_backend;
    include shared/server/base.conf;
}
