map $host $pixeldrain_backend {
    hostnames;
    ~^(?:autoconfig|autodiscover|fe-bounces)\.pixeldrain\.com$ forwardemail.net;
    ~^(?:btcpay|docs|stats|backup|srb2kart|monitor)\.pixeldrain\.com$ $host;
    default pixeldrain.com;
}

map $host $pixeldrain_sni {
    monitor.pixeldrain.com reports.hetrixtools.com;
    default '';
}

upstream pixeldrain.com {
    least_time header;
    server 103.107.198.177:443 max_fails=2 fail_timeout=15s;
    server 103.107.198.191:443 max_fails=2 fail_timeout=15s;
    server 103.107.199.58:443 max_fails=2 fail_timeout=15s;
    server 103.107.199.59:443 max_fails=2 fail_timeout=15s;
    server 103.107.199.60:443 max_fails=2 fail_timeout=15s;
    server 103.107.199.61:443 max_fails=2 fail_timeout=15s;
    server 103.107.199.62:443 max_fails=2 fail_timeout=15s;
    keepalive 64;
}

upstream forwardemail.net {
    server forwardemail.net:443;
    keepalive 32;
}

upstream btcpay.pixeldrain.com {
    server 51.159.106.4:443;
    keepalive 64;
}

upstream docs.pixeldrain.com {
    server 51.158.202.5:443;
    keepalive 64;
}

upstream stats.pixeldrain.com {
    server 51.158.202.5:443;
    keepalive 64;
}

upstream backup.pixeldrain.com {
    server 203.23.178.29:443;
    keepalive 64;
}

upstream srb2kart.pixeldrain.com {
    server 78.46.165.158:443;
    keepalive 64;
}

upstream monitor.pixeldrain.com {
    server reports.hetrixtools.com:443;
    keepalive 64;
}

server {
    server_name .pixeldrain.com;
    set $sni $pixeldrain_sni;
    set $backend $pixeldrain_backend;
    include shared/server/base.conf;
}
