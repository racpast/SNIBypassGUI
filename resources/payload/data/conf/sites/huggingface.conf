map $host $huggingface_backend {
    hostnames;
    ~^(?:discuss|status)\.huggingface\.co$ $host;
    default huggingface.cloudfront;
}

map $host $huggingface_sni {
    status.huggingface.co status.singpass.gov.sg;
    default '';
}

upstream discuss.huggingface.co {
    zone discuss.huggingface.co 32k;
    server hellohellohello.hosted-by-discourse.com:443 resolve;
    keepalive 64;
}

upstream status.huggingface.co {
    zone status.huggingface.co 32k;
    server statuspage.betteruptime.com:443 resolve;
    keepalive 32;
}

upstream huggingface.cloudfront {
    least_time header;
    include shared/upstream/cloudfront.conf;
    keepalive 64;
}

server {
    server_name .huggingface.co;
    set $sni $huggingface_sni;
    set $backend $huggingface_backend;
    include shared/server/base.conf;
}
