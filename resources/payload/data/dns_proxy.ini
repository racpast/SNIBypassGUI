; DNS Proxy Configuration
;
; The proxy binds every [Listener.*] declared below, and for each query it
; receives it races that listener's pool of upstream servers, returning whichever
; answers first.
;
; Three kinds of section, each introduced by its prefix:
;
;   [Upstream.NAME]   one server, described by a DNSStamp (sdns://...).
;                     See https://dnscrypt.info/stamps for the format and for a
;                     stamp generator.
;   [Pool.NAME]       a group of upstreams, named by an Upstreams= list.
;   [Listener.NAME]   an address and port to bind, and the Pool it races.
;
; There is no Enabled= key. A section's presence IS the declaration: an upstream
; named by a pool is used, and a section commented out or deleted is not. A
; second way to say the same thing was a second thing to keep in step.
;
; Several listeners exist so that different consumers can be given different
; transports. This file declares one; adding a second on another port that races
; a pool of plain-DNS upstreams is the ordinary way to give a client that cannot
; speak DoH a plain endpoint of its own, and it needs nothing beyond another
; [Pool.*] and another [Listener.*] here.

[General]
; How long one upstream may spend on a query before it gives up, in milliseconds.
; Per upstream, not per query: the race ends when the first answer arrives, so the
; slowest server never sets how long a client waits.
TimeoutMs=6000

; ---------------------------------------------------------------------------
; Upstreams
;
; The stamp carries the protocol, address, hostname, path and any pinned key, so
; a server is one line. A stamp whose address has no port takes its transport's
; default: 443 for DoH, 853 for DoT, 53 for plain DNS.
; ---------------------------------------------------------------------------

[Upstream.cloudflare-doh]
Stamp=sdns://AgcAAAAAAAAACTEyNy4wLjAuMQASZG5zLmNsb3VkZmxhcmUuY29tCi9kbnMtcXVlcnk

