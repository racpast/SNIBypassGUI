; DNS Proxy Configuration
;
; The proxy listens on 127.191.98.10:53 and forwards all DNS queries to
; upstream servers, racing them and returning whichever answers first.
;
; Upstream endpoints are configured using DNSStamp format (sdns://...).
; See https://dnscrypt.info/stamps for details and a stamp generator.

[General]
TimeoutMs=6000

[Upstream.cloudflare-doh]
