; ---------------------------------------------------------------------------
; Pools
;
; A pool is the set of servers one listener races. Names are the part after
; "Upstream." above, comma separated; a name that is not declared is reported in
; the log and skipped.
; ---------------------------------------------------------------------------

[Pool.encrypted]
Upstreams=cloudflare-doh, cloudflare-dot, nwps.fi, plan9dns-fl, nbg-dnscrypt, dct-de2, scaleway-fr, scaleway-ams, dct-fr, dct-de, deffer-dns.au, doh-crypto-sx, a-and-a, fdn, ekinao-doh-ipv4, bortzmeyer, nic.cz, olilo-doh, restena-doh-ipv4

; ---------------------------------------------------------------------------
; Listeners
;
; Address is required and must be a loopback literal; Port defaults to 53. Pool
; is optional — with no Pool= the listener races every upstream declared above,
; which is what a single-listener file means.
;
; 127.191.98.10 rather than 127.0.0.1: all of 127.0.0.0/8 reaches loopback, and
; 53 on 127.0.0.1 is where another local DNS server a machine already runs will
; be — Docker's, an ICS host's. An address nobody picks by convention coexists
; with them. Nginx's `resolver` directive points at this exact endpoint.
; ---------------------------------------------------------------------------

[Listener.main]
Address=127.191.98.10
Port=53
Pool=encrypted
