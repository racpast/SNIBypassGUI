# ==============================================================================
# Templates
# ==============================================================================

[templates.cf-optimize]
upstream = "@cloudflare"
select = ["ipv4"]

[templates.nat64-proxy]
nat64_prefix = "2a01:4f8:c2c:123f:64:5::"
address_family = "ipv4"
resolver = "@cloudflare-doh"


# ==============================================================================
# Regexes
# ==============================================================================

# [regexes.cdn-upos]
# pattern = "^upos-[a-z0-9-]+\\.akamaized\\.net$"
# scope_suffix = ["*.akamaized.net"]

[regexes.deviantart-non-cloudfront]
pattern = "^(?:(?:fc|orig|img|pre|t|prnt|film|vid)\\d{2}|sh|sitemaps|staff|phrac)\\.deviantart\\.net$"
scope_suffix = ["*.deviantart.net"]


# ==============================================================================
# Global
# ==============================================================================

[global]
log = "info"
connect_timeout = "5s"
resolver = "@dnspod-doh"
ech_refresh = "1h"
unmatched = "close"

[global.http2]
enabled = true
probe = "warn"

[ca]
cert_path = "ca/ca.crt"
key_path  = "ca/ca.key"
common_name = "SNIBypassGUI Local CA"
organization = "Racpast"
leaf_validity_days = 397
install_to_system_root = true

[store]
enabled = true
dir = "certs"
renew_margin_days = 30

[cache]
capacity = 8192
ttl_secs = 86400

[psl]
source = "file"
max_age = "30d"
auto_update = true


