; SNIBypassGUI service location interface.
;
; This file is a STABLE contract that lives next to SNIBypassGUI.exe and never
; moves, even though it participates in updates. It maps each service to its
; executable — so the actual layout under the program directory (e.g. the "data"
; folder) can be renamed or restructured in future releases without breaking
; startup — and carries the rest of the settings this program takes from its
; payload rather than from the compiled-in defaults.
;
; It is named for the payload it describes rather than for its [Paths] section:
; paths were all it held once, and the resolver endpoint below is not a path. A
; name that describes one section of five is a name that misleads the next person
; to open it.
;
; Paths are relative to the SNIBypassGUI.exe directory.
[Paths]
Nginx=data\nginx.exe
SniGate=data\sni-gate.exe
SupportedSites=data\supported_sites.dat
; DNS redirect rules. Each line is "ACTION domain...", where ACTION is an IP
; (redirect target) or "NX" (NXDOMAIN); a domain is exact by default and ".name"
; matches the apex and all subdomains. Those two forms are also exactly what the
; Name Resolution Policy Table can express, which is how the file is installed
; verbatim as the policy that routes those names to the local DNS server. See the
; file's own header for the full syntax.
Hosts=data\dns_hosts.txt
; DNS proxy configuration (listeners and their upstream pools).
DnsProxyConfig=data\dns_proxy.ini

; Where the local DNS server binds, and therefore where the policy rule sends the
; redirected names.
;
; Only the ADDRESS is configurable, deliberately. The policy table's rule format
; carries a server address and no port — the DNS Client service asks it on 53 — so a
; port configured here could not be expressed there, and a rule pointing at an
; address whose server listens elsewhere would break every name it covers. One value
; that cannot disagree is worth more than one that can.
;
; The address must stay on loopback: this is the endpoint an NRPT rule points at, and
; a redirector answering off-loopback would be a DNS server open to the network.
;
; Not 127.0.0.1 by default: all of 127.0.0.0/8 reaches loopback, and port 53 on
; 127.0.0.1 is the conventional home of every other local DNS server a machine
; might already run — Docker's, an ICS host's, a filtering proxy's. An address
; nobody picks by convention coexists with them instead of fighting for a port.
[Resolver]
Address=127.11.45.14

; ---------------------------------------------------------------------------
; Ports this program's payload needs, for the start-time conflict check.
;
; Each entry is a claim, and a claim is exactly what a bind needs to be answered:
;
;   ADDRESS:PORT[/TRANSPORT][/MODE]
;
;   ADDRESS    a numeric literal, required. "0.0.0.0" is the wildcard and conflicts
;              with far more than a specific address does, so it is spelled out and
;              never assumed.
;   PORT       required.
;   TRANSPORT  tcp (default), udp, or both.
;   MODE       exclusive, reuse, or default (default). This is the socket option the
;              consumer itself sets, and it is what decides whether a port someone
;              else holds is a conflict at all: a holder on a specific address does
;              not stop a wildcard holder that sets SO_REUSEADDR, while one on the
;              wildcard does. Nothing outside the holder's process can see which
;              option it chose, so the check reproduces the bind rather than reading
;              a table and guessing.
;
; The DNS endpoints are NOT listed here. The proxy's listeners are declared in
; dns_proxy.ini and the resolver's address above, so listing them again would be a
; second copy of a value that already exists — and the check reads those directly.
;
; MODE below is MEASURED, not assumed: each service was started alone and its
; listener probed by attempting the binds a newcomer would. nginx answers a
; wildcard SO_REUSEADDR bind while it holds the port, which only a REUSEADDR holder
; allows; sni-gate answers a specific-address bind but not a wildcard one, which is
; the signature of a default-mode holder. A value copied from documentation rather
; than measured is exactly what this check exists to stop trusting.
;
; Entries are '|'-separated, like every other list in this file.
[Ports]
Required=0.0.0.0:80/tcp/reuse|0.0.0.0:443/tcp|0.0.0.0:22222/tcp/reuse

; The uninstall manifest. It lives here, with the payload, for the same reason
; the paths above do: the program directory is NOT assumed to be ours alone
; (users may extract into a folder that already holds their own files), so
; uninstall deletes ONLY what is listed here and never sweeps the directory.
;
; Keeping the list next to the payload rather than inside the executable means
; the payload owns its own layout: adding a folder here is a payload change and
; ships through the ordinary signed update, with no need to rebuild or re-release
; the exe. The exe just executes whatever this file declares.
;
; Entries are '|'-separated and relative to the SNIBypassGUI.exe directory.
; Each entry can be:
;   1. Exact path (file or directory): data, meta.ini, config.ini
;   2. Single-level wildcard: *.new, *.bak, logs\*.log
;   3. Recursive wildcard: data\**\*.tmp, **\*.log
;
; Wildcard syntax:
;   *  - matches any characters (not path separators)
;   ?  - matches a single character
;   ** - recursively matches all subdirectories
;
; Forbidden patterns: ..\path (traversal), C:\path (absolute), **\* (redundant).
; Absolute paths, drive letters, UNC paths and any ".." component are rejected,
; so this list can never reach outside the program directory. SNIBypassGUI.exe
; itself is always removed and needs no entry. Directories are deleted with
; their contents; the program directory itself is removed only if nothing
; foreign is left in it.
[Uninstall]
Remove=data|licenses|logs|meta.ini|config.ini|THIRD_PARTY_LICENSES.txt|*.new|*.bak
; Certificates to pull from the Trusted Root stores on uninstall, matched
; case-insensitively against a certificate's subject OR issuer common name.
; sni-gate installs its locally generated CA there ([ca] common_name in
; sni-gate.toml); if that name ever changes, change it here in the same publish.
RootCertificates=SNIBypassGUI Local CA

; Cache cleanup patterns. These are matched and deleted when the user invokes
; the cache cleanup function, but are preserved during normal operation and
; uninstall (uninstall removes the whole tree anyway).
;
; Syntax is identical to [Uninstall] Remove patterns above.
[Cache]
Clean=logs|data\temp|data\cache|data\logs|data\certs

; Directories that must exist for the payload to function correctly. Git does
; not track empty directories, so this list ensures they are created when needed:
; before starting services, after cache cleanup, and after updates.
;
; Entries are exact paths relative to the SNIBypassGUI.exe directory. Supports
; recursive creation (e.g., "data\temp\nginx" creates data\, data\temp\, and
; data\temp\nginx\ if they don't exist).
[Directories]
Required=data\temp|data\logs
