# User-facing release notes, newest entry FIRST.
#
# The release CI reads ONLY the top entry and injects its `en` / `zh-CN` text
# into the signed manifest's `notes`, which the client shows on its update
# check. Notes describe ONE publish, not a version: a data-only refresh keeps
# the same APP_VERSION_NUM yet still gets its own entry here (e.g. "updated a
# site's IP"), because that publish cuts no GitHub Release and the manifest note
# is the only way users learn what changed.
#
# Before every push to main, PREPEND a new entry describing that push. Keep each
# note short and user-facing (not a commit log).
#
# The entry consumed is chosen by POSITION (the topmost one), never by `version`
# or `date` — those two fields are human-only labels and are free to repeat. So
# two publishes on the same day, or two data-only refreshes at the same version,
# are fine: just prepend a second entry on top for the second push. The only
# rule is one prepend per push.
#
# Write each note as a YAML list of plain items, one change per item:
#
#   en:
#     - Added support for X.
#     - Fixed Y.
#
# Do NOT type the bullet character. The client renders the list — the bullet, the
# separator between items, and the truncation of a long list are its decisions,
# made once per language, and they are the same for every entry. A marker typed
# here would be a second place that decides what a list looks like, and it would
# have to be typed correctly by every author forever.
#
# A single item is shown as one line; several become a bulleted list. That is why
# the file states items rather than sentences pre-joined with newlines: how many
# there are is what decides how they are drawn.
#
# The GitHub Release body is built separately (release_preamble.md plus a git log)
# and never reads this file, so nothing here needs to be Markdown. Nor does the
# client: it shows this text in a message box, which renders no Markdown at all.
#
# Entries that were published under the older convention — a block scalar whose
# lines each began with "• " — still work. tools/release.py accepts both and
# normalizes the old form by splitting it on newlines and stripping the marker, so
# the historical entries below are a record of what shipped and are never rewritten.

# --- newest first; CI reads the topmost entry ---

- version: "5.2.1"
  date: "2026-10-07"
  en:
    - Reworked port occupancy checks to use probe-binding to eliminate false-positive conflicts, and unified all endpoint verifications before startup.
    - Refactored the DNS proxy architecture to support multiple listeners with dedicated upstream pools.
    - Standardized release notes parsing and update list formatting.
  zh-CN:
    - 重构端口占用检测机制为试绑探测，解决端口冲突误报，并统一在启动前校验。
    - 重构 DNS 代理架构，支持多监听器与独立上游池配置。
    - 规范化更新日志解析规范与更新列表的排版渲染逻辑。

- version: "5.2.0"
  date: "2026-10-06"
  en:
    - Added support for Hugging Face, Hmoegirl, nhentai, and other sites.
  zh-CN:
    - 新增对 Hugging Face、H 萌娘、nhentai 等站点的支持。

- version: "5.2.0"
  date: "2026-10-05"
  en:
    - Introduced a multi-protocol DNS proxy supporting DNSCrypt, DoH, DoT, and more, alongside upgrading Nginx to an extended build to lay the groundwork for expanding site support.
    - Decoupled the updater into a standalone component, significantly improving fault tolerance during update procedures.
    - Added a visual update progress window, replacing the silent background update mechanism.
    - Various stability, reliability, and compatibility improvements.
  zh-CN:
    - 引入多协议 DNS 代理，支持 DNSCrypt、DoH、DoT 等，同时将 Nginx 升级至扩展构建版本，为后续支持更多站点奠定基础。
    - 重构更新器为独立组件，提升更新过程的容错能力。
    - 新增可视化更新进度窗口，取代静默后台更新方式。
    - 其他若干稳定性、可靠性与兼容性改进。

- version: "5.1.2"
  date: "2026-09-20"
  en: |
    • Added support for Ecosia, Tumblr, Wikipedia, and other sites.
    • Updated sni-gate to v2.5.1, resolved an issue where IPv6-first strategy left A records unutilized, and implemented IPv4/IPv6 dual-stack racing.
  zh-CN: |
    • 新增对 Ecosia、Tumblr、Wikipedia 等站点的支持。
    • 更新 sni-gate 组件至 v2.5.1，修复了 IPv6 优先策略导致 A 记录未被利用的问题，改为 IPv4/IPv6 并发竞速。

- version: "5.1.2"
  date: "2026-09-19"
  en: |
    • Added support for character.ai, Pixeldrain, yande.re, and other sites.
    • Fixed an issue where thumbnails and videos failed to load for China Mobile users on Hanime1.me.
  zh-CN: |
    • 新增对 character.ai、Pixeldrain、yande.re 等站点的支持。
    • 修复了中国移动用户使用 Hanime1.me 时缩略图和视频无法加载的问题。

- version: "5.1.2"
  date: "2026-09-18"
  en: |
    • Added support for MEGA, Note.ms, pixivFANBOX, and other sites.
  zh-CN: |
    • 新增对 MEGA、Note.ms、pixivFANBOX 等站点的支持。

- version: "5.1.2"
  date: "2026-09-16"
  en: |
    • Added support for Danbooru, Perplexity, and South Plus.
  zh-CN: |
    • 新增对 Danbooru、Perplexity、南+ South Plus 的支持。

- version: "5.1.2"
  date: "2026-09-16"
  en: |
    • Added support for ASMRGAY, Patreon, Proton, and other sites.
    • Updated sni-gate to v2.4.1 and leveraged its new capabilities to improve connection speeds for most supported sites.
  zh-CN: |
    • 新增对 ASMR 基佬中心、Patreon、Proton 等站点的支持。
    • 更新 sni-gate 组件至 v2.4.1，并利用其新特性优化了大部分站点的连接速度。

- version: "5.1.2"
  date: "2026-08-27"
  en: |
    • Component processes are now continuously supervised throughout their lifecycle. If any component terminates unexpectedly, all remaining components and DNS redirection are halted immediately to prevent silent connection failures across supported sites. Supervision of DNS redirection covers both its local DNS service and DNS policy rules: missing rules are automatically restored, and if they cannot be maintained, all components are stopped with an explicit reason provided.
    • Removed fixed delays from the startup sequence. Components are considered ready as soon as their processes are created, significantly reducing service startup time.
    • Refactored failure diagnostics to explicitly identify the affected component and its probable cause.
    • Fixed the log folder being created even with logging turned off, and no longer being re-created after a cache cleanup, which silently stopped logging until the program was restarted.
  zh-CN: |
    • 组件进程现全程受到监控。任一组件异常退出时，将自动终止其余组件及 DNS 重定向，避免受支持站点在无感知的情况下静默失效。其中，DNS 重定向的监控覆盖本地 DNS 服务及 DNS 策略规则两个组成部分。规则丢失时将自动恢复；若无法维持，则终止全部组件并明确告知原因。
    • 移除启动流程中的固定等待延迟。组件进程创建成功即视为就绪，显著缩短服务启动耗时。
    • 重构故障诊断与提示信息，明确标注具体异常组件及其可能原因。
    • 修复未开启日志记录时仍会创建日志文件夹，以及清理缓存后日志文件夹不再重建、导致日志静默失效直至重启程序的问题。

- version: "5.1.1"
  date: "2026-08-26"
  en: |
    Treat a service as started once its process is alive, not once it listens.
  zh-CN: |
    以进程存活判定服务启动完成，不再等待端口监听。

- version: "5.1.0"
  date: "2026-08-26"
  en: |
    - Reworked DNS redirection from WinDivert packet interception to Windows NRPT combined with a local DNS service, effectively preventing false positives and interference from security software.
    - Improved service status detection: manually started component processes are now correctly identified and displayed as running.
    - Enhanced startup sequence reliability: introduced full integrity verification during startup; failure of any component automatically rolls back previously started ones to prevent incomplete service states.
    - Reworked start-at-logon to use the Task Scheduler API; fixed issues where start-at-logon and the nginx component failed to launch when the installation path contained non-ASCII characters.
    - Various stability, reliability, and compatibility improvements.
  zh-CN: |
    - 重构 DNS 重定向机制，由 WinDivert 拦截改为基于 NRPT 与本地 DNS 服务实现，可有效避免安全软件误报与拦截。
    - 优化服务状态检测，现可正确识别并显示手动启动的组件进程。
    - 增强启动流程可靠性，启动过程新增完整性校验，任一组件启动失败时将自动回滚已启动的组件，避免服务处于不完整状态。
    - 重构开机自启动实现，改用任务计划程序 API；修复安装路径包含非 ASCII 字符时，开机自启动与 nginx 组件无法正常启动的问题。
    - 其他若干稳定性、可靠性与兼容性改进。

- version: "5.0.0"
  date: "2026-08-24"
  en: |
    Initial public release.
  zh-CN: |
    首次公开发布。
